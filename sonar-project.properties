# =========================================================================
# SonarQube / SonarCloud Project Configuration Properties
# =========================================================================

# Mandatory placeholders - replace with your actual SonarQube Cloud credentials
sonar.organization=rudresh77
sonar.projectKey=Rudresh77_Demo
sonar.projectName=Demo

# Project version
sonar.projectVersion=1.0.0

# Path to the source code to be analyzed
sonar.sources=.

# Exclusions - patterns to exclude from analysis
sonar.exclusions=node_modules/**, public/**, **/*.spec.js, **/*.test.js

# Source code language encoding
sonar.sourceEncoding=UTF-8

# JavaScript-specific properties
sonar.javascript.environments=node, browser
sonar.javascript.file.suffixes=.js
